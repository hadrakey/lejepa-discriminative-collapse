[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lejepa-discriminative-collapse"
version = "0.1.0"
description = "Code for the post 'When Preventing Collapse Destroys Useful Representations' (LeJEPA on Tennessee Eastman)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "pyreadr",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ldc = "ldc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
